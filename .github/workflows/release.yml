name: Signed macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: ./build-app.sh

      - name: Package, deep-sign, and notarize DMG
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "main" || -z "$VERSION" ]]; then
            VERSION="$(cat VERSION)"
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dmg-staging
          chmod +x ./scripts/macos-sign-and-notarize-dmg.sh
          ./scripts/macos-sign-and-notarize-dmg.sh \
            --app TrailPoint.app \
            --pkg dmg-staging/TrailPointAgent.pkg \
            --dmg "TrailPoint-${VERSION}.dmg" \
            --staging dmg-staging \
            --version "$VERSION"
          echo "RELEASE_DMG=TrailPoint-${VERSION}.dmg" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: TrailPoint ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: ${{ env.RELEASE_DMG }}
          fail_on_unmatched_files: true
          draft: false
          body: |
            Developer ID–signed and notarized TrailPoint for macOS.

            Signed with Alex Spaulding’s Apple Developer identity. 
            Open the `.dmg` and double-click `TrailPointAgent.pkg` to install the app and automatically configure it to start at login.
